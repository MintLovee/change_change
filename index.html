<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F3EF" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>바꿀래</title>
  <meta name="description" content="가진 것과 찾는 것을 등록하면 서로 원하는 물건을 가진 사람끼리 이어 주는 물물교환 웹앱" />
  <meta property="og:title" content="바꿀래" />
  <meta property="og:description" content="가진 것과 찾는 것을 등록하면 서로 원하는 물건을 가진 사람끼리 이어 주는 물물교환 웹앱" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="/src/style.css" />
  <script>window.APP_CONFIG = {supabaseUrl: "{{SUPABASE_URL}}", supabaseAnonKey: "{{SUPABASE_ANON_KEY}}"};</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script src="/src/geo.js"></script>
</head>
<body>
<div id="app">
  <div class="offline-bar" id="offlineBar" role="status" aria-live="polite" hidden>연결이 끊겼어요. 인터넷 연결을 확인해 주세요.</div>
  <aside class="sidebar hidden" id="sidebar" aria-label="주 메뉴"></aside>
  <div class="stage" id="stage">
    <div id="main"></div>
    <div id="pages"></div>
    <button class="fab hidden" id="fab" data-act="newItem" aria-label="새 물건 등록"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>물건 등록</button>
    <nav class="tabbar hidden" id="tabbar" aria-label="하단 메뉴">
      <button class="tab on" data-tab="home" aria-label="홈"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.8l8.5 6.7V19a1.6 1.6 0 0 1-1.6 1.6h-3.6v-6h-6.6v6H5.1A1.6 1.6 0 0 1 3.5 19z"/></svg>홈</button>
      <button class="tab" data-tab="challenge" aria-label="챌린지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 7.5 8.3 14.7a2 2 0 0 0 2.8 2.8l7.6-7.6a4 4 0 0 0-5.6-5.6L5.4 12a6 6 0 0 0 8.5 8.5l6.4-6.4"/></svg>챌린지</button>
      <button class="tab" data-tab="offers" aria-label="제안함"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>제안함</button>
      <button class="tab" data-tab="me" aria-label="마이"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.4-3.6 4.4-5.5 8-5.5s6.6 1.9 8 5.5"/></svg>마이</button>
    </nav>
    <div class="loading" id="loading" aria-label="화면 불러오는 중"></div>
  </div>
</div>
<script src="/src/app.js"></script>
</body>
</html>
